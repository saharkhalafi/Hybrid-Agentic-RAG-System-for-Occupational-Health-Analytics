services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ohse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ohse_intelligence
    ports:
      - "5434:5432"
    volumes:
      - ohse_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ohse_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ohse_pgdata:
